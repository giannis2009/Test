<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AppleFX</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#5ac8fa"/><stop offset="0.5" stop-color="#0a84ff"/><stop offset="1" stop-color="#bf5af2"/>
            </linearGradient>
          </defs>
          <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#lg)"/>
          <path d="M16 6.5c.9 4.6 2.9 6.6 7.5 7.5-4.6.9-6.6 2.9-7.5 7.5-.9-4.6-2.9-6.6-7.5-7.5 4.6-.9 6.6-2.9 7.5-7.5z" fill="#fff"/>
          <circle cx="23.5" cy="23.5" r="2" fill="#fff" opacity=".85"/>
        </svg>
        <div>
          <div class="name">AppleFX</div>
          <div class="sub">Apple-style motion for Premiere Pro</div>
        </div>
      </div>
      <span id="hostPill" class="pill">…</span>
    </header>

    <nav id="tabs" class="tabs" role="tablist"></nav>

    <section class="stage">
      <canvas id="preview" class="preview" aria-label="Live preview"></canvas>
      <div class="stage-bar">
        <div>
          <div id="presetName" class="preset-name"></div>
          <div id="presetDesc" class="preset-desc"></div>
        </div>
        <button id="replay" class="icon-btn" title="Replay preview" aria-label="Replay preview">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
      </div>
    </section>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.9 10.6l4.7 4.7 1.4-1.4-4.7-4.7A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
      <input id="search" type="search" placeholder="Search presets" autocomplete="off" spellcheck="false">
    </div>

    <p id="catHint" class="hint"></p>
    <div id="grid" class="grid"></div>

    <section class="settings">
      <h3>Settings</h3>
      <div id="controls"></div>
    </section>

    <footer class="bottom">
      <div id="selection" class="selection">Select clips in the timeline</div>
      <div class="actions">
        <button id="reset" class="btn ghost" title="Remove Motion, Opacity and Transform keyframes from the selected clips">Clear</button>
        <button id="apply" class="btn primary">Apply</button>
      </div>
    </footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/easing.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/cep.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
